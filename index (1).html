<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1028">
<meta name="color-scheme" content="dark">
<title>Lucidum – lucidní snění</title>
<style>
:root{
  --bg:#0b1028; --bg2:#10163a; --surface:#161d4a; --surface2:#1d2560; --line:#2a3373;
  --text:#d9d4ea; --dim:#9893b8; --faint:#6a6791;
  --violet:#8a7be0; --violet2:#5b4bb8; --gold:#c9a85c; --azure:#62b6cc; --rose:#c97a9a; --green:#7fbf9a;
  --radius-l:22px; --radius-m:14px; --radius-s:10px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  --nav-h:68px;
  color-scheme:dark;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;overscroll-behavior:none}
body{background:radial-gradient(120% 60% at 50% -10%,#1f1a52 0%,transparent 60%),var(--bg);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
input,textarea,[contenteditable]{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:.01em;margin:0}
h2{font-size:1.5rem;line-height:1.2}
h3{font-size:1.15rem;line-height:1.3}
p{margin:.4em 0}
a{color:var(--azure)}
:focus-visible{outline:2px solid var(--azure);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px 8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-moon{width:34px;height:34px;flex:none}
.brand h1{font-size:1.35rem;color:var(--text)}
.brand small{display:block;color:var(--dim);font-size:.78rem;font-family:var(--sans);margin-top:-2px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.icon-btn svg{width:22px;height:22px}

main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:6px 16px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}
.view{display:none;max-width:680px;margin:0 auto}
.view.active{display:block;animation:viewIn .32s cubic-bezier(.2,.8,.2,1)}
.view.from-left.active{animation-name:viewInL}
@keyframes viewIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes viewInL{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}

.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(12,16,44,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:.72rem;position:relative;transition:color .2s}
.bottomnav button svg{width:25px;height:25px;transition:transform .25s}
.bottomnav button.active{color:var(--gold)}
.bottomnav button.active svg{transform:translateY(-2px)}
.bottomnav button.active::before{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

.section{margin:18px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.section-head span{color:var(--dim);font-size:.85rem}
.panel{background:linear-gradient(180deg,rgba(29,37,96,.75),rgba(22,29,74,.75));border:1px solid var(--line);border-radius:var(--radius-l);padding:16px}
.panel + .panel{margin-top:12px}
.muted{color:var(--dim)}
.small{font-size:.85rem}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.stack > * + *{margin-top:10px}
.hidden{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:var(--radius-m);background:var(--surface2);border:1px solid var(--line);color:var(--text);font-weight:600;font-size:1rem;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--violet),var(--violet2));border-color:transparent;color:#f1edff}
.btn.gold{background:linear-gradient(135deg,#d6b86c,#a9873e);border-color:transparent;color:#1b1630}
.btn.ghost{background:transparent}
.btn.danger{background:rgba(201,122,154,.15);border-color:rgba(201,122,154,.4);color:#e7b3c8}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:1.1rem;border-radius:var(--radius-l)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.9rem}
.btn svg{width:20px;height:20px;flex:none}

label.field{display:block}
label.field > span{display:block;font-size:.85rem;color:var(--dim);margin:0 0 6px 2px}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:rgba(8,11,32,.6);border:1px solid var(--line);color:var(--text);border-radius:var(--radius-m);padding:13px 14px;font:inherit;font-size:1rem;min-height:50px;outline:none;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--violet)}
textarea{resize:vertical;line-height:1.6}
textarea.dream-text{min-height:240px;font-size:1.08rem;font-family:var(--serif)}
input[type=range]{width:100%;accent-color:var(--gold);height:36px}
::placeholder{color:var(--faint)}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(.75)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);font-size:.92rem;transition:all .15s}
.chip.on{background:rgba(138,123,224,.22);border-color:var(--violet);color:var(--text)}
.chip.gold.on{background:rgba(201,168,92,.18);border-color:var(--gold)}
.chip.static{min-height:auto;padding:3px 10px;font-size:.8rem}
.chip-group-title{font-size:.82rem;color:var(--faint);margin:14px 2px 8px}

.seg{display:flex;background:rgba(8,11,32,.55);border:1px solid var(--line);border-radius:var(--radius-m);padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;color:var(--dim);font-size:.9rem}
.seg button.on{background:var(--surface2);color:var(--text)}

.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:6px 4px;cursor:pointer}
.switch input{display:none}
.switch .track{width:58px;height:34px;border-radius:999px;background:#2a2f5e;position:relative;flex:none;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#bdb7d8;transition:transform .2s,background .2s}
.switch input:checked + .track{background:var(--violet2)}
.switch input:checked + .track::after{transform:translateX(24px);background:var(--gold)}

.vivid{display:flex;gap:8px}
.vivid button{flex:1;min-height:56px;border-radius:var(--radius-m);border:1px solid var(--line);background:rgba(255,255,255,.03);display:grid;place-items:center;font-size:.8rem;color:var(--dim)}
.vivid button b{display:block;font-family:var(--serif);font-size:1.3rem;color:var(--text);font-weight:500}
.vivid button.on{border-color:var(--gold);background:rgba(201,168,92,.16)}

.dream-card{display:block;width:100%;text-align:left;padding:16px;border-radius:var(--radius-l);border:1px solid var(--line);background:rgba(22,29,74,.7);margin-bottom:10px;position:relative;overflow:hidden}
.dream-card.lucid{border-color:rgba(201,168,92,.55);background:linear-gradient(135deg,rgba(201,168,92,.12),rgba(22,29,74,.75) 55%)}
.dream-card h3{font-size:1.1rem;margin-bottom:4px}
.dream-card .meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--faint);font-size:.8rem;margin-bottom:6px}
.dream-card .snip{color:var(--dim);font-size:.93rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge-lucid{color:var(--gold)}
.moons{letter-spacing:2px;color:var(--gold)}
mark{background:rgba(201,168,92,.3);color:inherit;border-radius:3px}

.banner{border-radius:var(--radius-l);padding:18px;background:linear-gradient(135deg,rgba(98,182,204,.18),rgba(138,123,224,.18));border:1px solid rgba(98,182,204,.35)}
.banner h3{margin-bottom:4px}

.empty{padding:28px 16px;text-align:center;color:var(--dim)}
.empty svg{width:64px;height:64px;opacity:.6;margin-bottom:8px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{padding:14px;border-radius:var(--radius-m);background:rgba(8,11,32,.45);border:1px solid var(--line)}
.kpi b{display:block;font-family:var(--serif);font-size:1.8rem;font-weight:500;line-height:1.1}
.kpi span{color:var(--dim);font-size:.82rem}
canvas{display:block;width:100%}
.bars .bar{margin:8px 0}
.bars .bar-top{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.bars .bar-track{height:10px;border-radius:999px;background:rgba(8,11,32,.6);overflow:hidden}
.bars .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet2),var(--azure))}
.progress{height:12px;border-radius:999px;background:rgba(8,11,32,.6);overflow:hidden;border:1px solid var(--line)}
.progress > div{height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:999px;transition:width .6s}

.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:12px 8px;border-radius:var(--radius-m);text-align:center;border:1px solid var(--line);background:rgba(8,11,32,.4);font-size:.78rem;color:var(--faint)}
.badge .ic{font-size:1.7rem;display:block;filter:grayscale(1);opacity:.35;margin-bottom:4px}
.badge b{display:block;font-size:.84rem;color:var(--dim);font-weight:600}
.badge.got{border-color:rgba(201,168,92,.5);background:rgba(201,168,92,.08)}
.badge.got .ic{filter:none;opacity:1}
.badge.got b{color:var(--gold)}

.tech{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:16px;border-radius:var(--radius-l);border:1px solid var(--line);background:rgba(22,29,74,.7);margin-bottom:10px}
.tech .glyph{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:1.5rem;background:rgba(138,123,224,.16);border:1px solid rgba(138,123,224,.35)}
.tech .glyph.done{background:rgba(201,168,92,.16);border-color:rgba(201,168,92,.45)}
.tech h3{margin-bottom:2px}
.tech p{color:var(--dim);font-size:.9rem;margin:0}
.tag-level{font-size:.75rem;color:var(--azure)}

.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;position:relative;padding:4px 0 10px 42px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(138,123,224,.2);border:1px solid var(--violet);font-size:.85rem;font-weight:600}
.dodont{display:grid;gap:10px;margin-top:10px}
.dodont div{padding:12px 14px;border-radius:var(--radius-m);font-size:.93rem}
.dodont .do{background:rgba(127,191,154,.1);border:1px solid rgba(127,191,154,.35)}
.dodont .dont{background:rgba(201,122,154,.1);border:1px solid rgba(201,122,154,.35)}
.dodont ul{margin:6px 0 0;padding-left:18px}
.tipbox{margin-top:12px;padding:12px 14px;border-radius:var(--radius-m);background:rgba(98,182,204,.1);border:1px solid rgba(98,182,204,.35);font-size:.93rem}
.prose{font-size:1rem;line-height:1.65;user-select:text;-webkit-user-select:text}
.prose.serif{font-family:var(--serif);font-size:1.08rem;line-height:1.75;white-space:pre-wrap}

/* modal sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,5,18,.7);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:680px;max-height:92%;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet{transform:none}
.sheet .grip{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet .sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .sheet-head h2{flex:1}

/* full-screen editor */
.fullscreen{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.fullscreen.open{transform:none}
.fs-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.fs-head h2{flex:1;font-size:1.25rem}
.fs-body{flex:1;overflow-y:auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.fs-body > *{max-width:680px;margin-left:auto;margin-right:auto}
.fs-foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(11,16,40,.95);border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,20px);z-index:90;background:var(--surface2);border:1px solid var(--gold);color:var(--text);padding:12px 18px;border-radius:var(--radius-m);max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:all .3s;font-size:.95rem}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* night dim overlay */
#nightScreen{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#3d2f5c;text-align:center;padding:24px}
#nightScreen.open{display:flex}
#nightScreen .big{font-family:var(--serif);font-size:4rem;color:#4a3a70}
#nightScreen .hint{font-size:.85rem;color:#2e2648}
#dimLayer{position:fixed;inset:0;background:#000;pointer-events:none;z-index:85;opacity:0}

/* alarm screen */
#alarmScreen{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px;text-align:center;background:radial-gradient(circle at 50% 40%,#2a2266,#070a1f 70%)}
#alarmScreen.open{display:flex}
#alarmScreen h2{font-size:2rem}
.pulse-ring{width:150px;height:150px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;animation:ring 3s ease-in-out infinite;font-size:3rem}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(201,168,92,.35)}50%{box-shadow:0 0 0 26px rgba(201,168,92,0)}}

/* breathing */
.breath-stage{position:relative;height:270px;display:grid;place-items:center}
.breath-circle{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(98,182,204,.55),rgba(91,75,184,.35) 60%,rgba(91,75,184,.05));border:1px solid rgba(98,182,204,.5);transform:scale(1);transition-property:transform;transition-timing-function:ease-in-out}
.breath-label{position:absolute;text-align:center;font-family:var(--serif);font-size:1.4rem;pointer-events:none}
.breath-label small{display:block;font-family:var(--sans);font-size:.85rem;color:var(--dim)}

.countdown{font-family:var(--serif);font-size:3.4rem;text-align:center;line-height:1.1;font-variant-numeric:tabular-nums}

/* games */
.game-area{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px 0}
.game-text{font-family:var(--serif);font-size:1.6rem;text-align:center;min-height:2.4em;transition:filter .3s,opacity .3s;padding:0 8px}
.game-text.blur{filter:blur(14px);opacity:.2}
.game-clock{font-family:var(--serif);font-size:4rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.odd-grid{display:grid;gap:8px;width:100%;max-width:360px}
.odd-grid button{aspect-ratio:1;border-radius:12px;background:rgba(8,11,32,.55);border:1px solid var(--line);font-size:1.6rem;color:var(--azure);display:grid;place-items:center}
.score{display:flex;justify-content:space-between;width:100%;color:var(--dim);font-size:.9rem}
.flash-ok{animation:fok .4s}
.flash-bad{animation:fbad .4s}
@keyframes fok{50%{background:rgba(127,191,154,.25)}}
@keyframes fbad{50%{background:rgba(201,122,154,.25)}}

.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:10px 0;border-bottom:1px solid var(--line)}
.list-plain li:last-child{border-bottom:0}
.checkrow{display:flex;align-items:center;gap:14px;width:100%;min-height:54px;text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
.checkrow:last-child{border-bottom:0}
.checkrow .box{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .2s}
.checkrow.on .box{background:var(--gold);border-color:var(--gold);color:#1b1630}
.checkrow.on span{color:var(--dim);text-decoration:line-through}
.affirm{font-family:var(--serif);font-size:1.3rem;line-height:1.5;text-align:center;padding:18px 8px;color:#e6dcb8}
.timepreview{font-variant-numeric:tabular-nums;color:var(--azure)}
.levelcard{display:flex;gap:16px;align-items:center}
.levelcard svg{width:72px;height:72px;flex:none}
.topbar{gap:8px}
.guide-sec{border:1px solid var(--line);border-radius:var(--radius-m);margin-bottom:10px;background:rgba(22,29,74,.6);overflow:hidden}
.guide-sec > button{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left}
.guide-sec > button h3{flex:1;font-size:1.08rem}
.guide-sec > button .chev{transition:transform .25s;color:var(--dim)}
.guide-sec.open > button .chev{transform:rotate(180deg)}
.guide-sec .gbody{display:none;padding:0 16px 14px}
.guide-sec.open .gbody{display:block}
.guide-list{margin:4px 0;padding-left:20px}
.guide-list li{margin:7px 0;line-height:1.55}
.guide-lead{color:var(--dim);font-size:.93rem;margin:0 0 6px}
pre.code{white-space:pre-wrap;word-break:break-all;font-size:.75rem;max-height:200px;overflow:auto;background:rgba(8,11,32,.6);padding:10px;border-radius:10px;border:1px solid var(--line);user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-moon" viewBox="0 0 40 40" aria-hidden="true"><defs><radialGradient id="mg" cx="40%" cy="35%"><stop offset="0" stop-color="#f1e2b0"/><stop offset="1" stop-color="#c9a85c"/></radialGradient></defs><circle cx="20" cy="20" r="15" fill="url(#mg)"/><circle id="brandShadow" cx="27" cy="16" r="13" fill="#0b1028"/></svg>
      <div><h1>Lucidum</h1><small id="levelLabel">Začátečník</small></div>
    </div>
    <button class="icon-btn" id="btnHelp" aria-label="Návod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.4 9.2a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.4-2.6 4"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
    <button class="icon-btn" id="btnDim" aria-label="Noční displej"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></button>

    const next = all.slice(off + m.length).trim().split(/\s+/)[0].toLowerCase().replace(/[^\p{L}]/gu, '');
    if (PARTICIPLES.has(next) || PARTICIPLES.has(prev.toLowerCase())) { stats.n++; return prev + sp + matchCase(s, 'jsem'); }
    return m;
  });
  t = t.replace(/(\p{L}+)(\s+)(sem)(?=\s*([.!?,…]|$))/gmu, (m, prev, sp, s) => {
    if (PARTICIPLES.has(prev.toLowerCase())) { stats.n++; return prev + sp + matchCase(s, 'jsem'); }
    return m;
  });
  // „ze“ → „že“ po slovesech myšlení a řeči
  t = t.replace(/((?:^|(?<=[\s(„"]))(?:řekl|řekla|řekli|říkal|říkala|myslel|myslela|věděl|věděla|zjistil|zjistila|uvědomil|uvědomila|tvrdil|tvrdila|cítil|cítila|vím|nevím|myslím|jasné|zdálo se)\s+)ze(?=\s)/giu, (m, a) => { stats.n++; return a + 'že'; });
  // interpunkce
  t = count(t, t.replace(/\.{3,}/g, '…'));
  t = count(t, t.replace(/([,;:])\1+/g, '$1'));
  t = count(t, t.replace(/\s+([,.!?;:…])/g, '$1'));
  t = count(t, t.replace(/([,.!?;:…])(?=[\p{L}])/gu, '$1 '));
  // čárky před podřadicími spojkami
  const commaRe = new RegExp(`([\\p{L}\\d]+)(\\s+)(${COMMA_WORDS})(?=[\\s,.!?…]|$)`, 'giu');
  t = t.replace(commaRe, (m, prev, sp, w, off, all) => {
    if (NO_COMMA_BEFORE.has(prev.toLowerCase())) return m;
    const before = all.slice(0, off);
    if (/[,;:]\s*$/.test(before)) return m;
    stats.n++; return prev + ',' + sp + w;
  });
  // velká písmena
  t = t.replace(/(^|[.!?…]\s+|\n\s*)(\p{Ll})/gu, (m, a, c) => { stats.n++; return a + c.toUpperCase(); });
  // tečka na konci každého odstavce
  t = t.split('\n').map(l => {
    if (l && /[\p{L}\d)"“”]$/u.test(l)) { stats.n++; return l + '.'; }
    return l;
  }).join('\n');
  t = t.replace(/ {2,}/g, ' ').trim();
  return { text: t, changes: stats.n };
}
function autoTitle(text) {
  const words = (text || '').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);
  if (!words.length) return 'Sen bez názvu';
  const firstSentence = (text.split(/[.!?…\n]/)[0] || '').trim().split(/\s+/);
  let w = (firstSentence.length >= 3 ? firstSentence : words).slice(0, 6);
  let title = w.join(' ').replace(/[,;:.!?…]+$/, '');
  title = title.charAt(0).toUpperCase() + title.slice(1);
  if (words.length > w.length) title += '…';
  return title;
}

const SUFFIXES = ['atech', 'ětem', 'atům', 'ech', 'ích', 'ého', 'ěmi', 'emi', 'ému', 'ího', 'ími', 'ách', 'ata', 'aty', 'ých', 'ama', 'ami', 'ové', 'ovi', 'ými', 'ou', 'em', 'ém', 'ím', 'ům', 'ám', 'ým', 'mi', 'a', 'e', 'i', 'o', 'u', 'y', 'á', 'é', 'í', 'ý', 'ě', 'ů'];
function stem(w) {
  for (const s of SUFFIXES) if (w.length - s.length >= 3 && w.endsWith(s)) return w.slice(0, -s.length);
  return w;
}
let signsCache = null;
function dreamSigns(limit = 12) {
  if (signsCache && signsCache.n === S.dreams.length && signsCache.u === lastDataChange) return signsCache.list.slice(0, limit);
  const stems = new Map();
  for (const d of S.dreams) {
    const seen = new Set();
    const words = (d.title + ' ' + d.text).toLowerCase().match(/\p{L}+/gu) || [];
    for (const w of words) {
      if (w.length < 3 || STOPWORDS.has(w)) continue;
      const st = stem(w);
      if (STOPWORDS.has(st)) continue;
      let e = stems.get(st);
      if (!e) { e = { docs: 0, forms: new Map(), lucid: 0 }; stems.set(st, e); }
      e.forms.set(w, (e.forms.get(w) || 0) + 1);
      if (!seen.has(st)) { seen.add(st); e.docs++; if (d.lucid) e.lucid++; }
    }
    for (const tg of d.tags) {
      const st = '#' + tg.toLowerCase();
      let e = stems.get(st);
      if (!e) { e = { docs: 0, forms: new Map([[tg, 1]]), lucid: 0, tag: true }; stems.set(st, e); }
      e.docs++; if (d.lucid) e.lucid++;
    }
  }
  const minDocs = S.dreams.length >= 6 ? 2 : 1;
  const list = [...stems.entries()].filter(([, e]) => e.docs >= minDocs).map(([st, e]) => {
    const form = [...e.forms.entries()].sort((a, b) => b[1] - a[1])[0][0];
    return { key: st, word: form, count: e.docs, lucid: e.lucid, tag: !!e.tag, pct: S.dreams.length ? Math.round(e.docs / S.dreams.length * 100) : 0 };
  }).sort((a, b) => b.count - a.count || (b.tag ? 1 : 0) - (a.tag ? 1 : 0) || a.word.localeCompare(b.word, 'cs'));
  signsCache = { n: S.dreams.length, u: lastDataChange, list };
  return list.slice(0, limit);
}

function dreamDays() { return new Set(S.dreams.map(d => d.date)); }
function streaks() {
  const days = dreamDays();
  let cur = 0; let d = new Date();
  if (!days.has(dayKey(d))) d = addDays(d, -1);
  while (days.has(dayKey(d))) { cur++; d = addDays(d, -1); }
  const sorted = [...days].sort();
  let best = 0, run = 0, prev = null;
  for (const k of sorted) {
    const dt = parseDay(k);
    if (prev && Math.round((dt - prev) / 864e5) === 1) run++; else run = 1;
    best = Math.max(best, run); prev = dt;
  }
  return { cur, best: Math.max(best, cur) };
}
function rcToday() { const k = dayKey(); return S.rcLog.filter(t => dayKey(new Date(t)) === k).length; }
function ritualCount() { return Object.values(S.rituals).filter(r => r && r.done && r.done.length >= 4).length; }
function xp() {
  const lucid = S.dreams.filter(d => d.lucid).length;
  return S.dreams.length * 10 + lucid * 40 + S.academyRead.length * 15 + Math.min(S.rcLog.length, 1500) + streaks().best * 5 +
    S.counters.wbtb * 15 + S.counters.breath * 5 + ritualCount() * 8 + Math.min(S.games.played, 200) * 2;
}

    if (jFilter.sign) {
      if (jFilter.sign.tag) { if (!d.tags.some(t => t.toLowerCase() === jFilter.sign.key.slice(1))) return false; }
      else {
        const ws = (d.title + ' ' + d.text).toLowerCase().match(/\p{L}+/gu) || [];

    if (q) {
      const hay = fold([d.title, d.text, d.tags.join(' '), d.emotions.join(' '), d.trigger, fmtDate(d.date)].join(' '));

  for (const p of parts) {
    const re = new RegExp('(' + esc(p).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');

async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast('Zkopírováno do schránky'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Zkopírováno do schránky'); } catch (e2) { toast('Kopírování se nepovedlo'); }
    ta.remove();
  }
}

function saveEditor() {

/* ---------- Ukládání souborů (export, .ics) ---------- */
function hasNative(name) {
  const C = window.Capacitor;
  return !!(C && typeof C.nativePromise === 'function' && typeof C.isNativePlatform === 'function' && C.isNativePlatform() && Array.isArray(C.PluginHeaders) && C.PluginHeaders.some(h => h && h.name === name));
}
async function saveFile(name, content, mime) {
  // 1) Nativní Android aplikace (Capacitor): zapiš soubor a otevři systémové „Sdílet / Otevřít v…“
  if (hasNative('Filesystem') && hasNative('Share')) {
    try {
      const r = await window.Capacitor.nativePromise('Filesystem', 'writeFile', { path: name, data: content, directory: 'CACHE', encoding: 'utf8', recursive: true });
      await window.Capacitor.nativePromise('Share', 'share', { title: name, url: r.uri, dialogTitle: name.endsWith('.ics') ? 'Otevřít v Kalendáři' : 'Uložit zálohu' });
      return;
    } catch (e) { if (/cancel/i.test(String((e && e.message) || e))) return; }
  }
  // 2) Web Share API se soubory
  try {
    if (typeof File === 'function' && navigator.canShare) {
      const file = new File([content], name, { type: mime });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); toast('Soubor odeslán ✓'); return; }
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  // 3) Klasické stažení
  try {
    const blob = new Blob([content], { type: mime + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
  } catch (e) { /* pokračuj na záložní variantu */ }
  // 4) Záložní varianta: obsah ke zkopírování (některá WebView stahování tiše blokují)
  markOverlay();
  openSheet(`<div class="sheet-head"><h2>Soubor ${esc(name)}</h2></div>
    <p class="muted small">Stahování bylo spuštěno. Pokud se v telefonu nic neobjevilo (některé aplikační obaly stahování blokují), zkopíruj obsah a ulož ho jako soubor <b>${esc(name)}</b> – např. přes Poznámky, Soubory nebo e-mail sobě.</p>
    <pre class="code">${esc(content.length > 6000 ? content.slice(0, 6000) + '\n…' : content)}</pre>
    <div class="row" style="margin-top:14px"><button class="btn primary grow" id="ffCopy">Kopírovat celý obsah</button><button class="btn grow" id="ffClose">Hotovo</button></div>`, sh => {
    $('#ffCopy', sh).onclick = () => copyText(content);
    $('#ffClose', sh).onclick = closeSheet;
  });
}

let alarmLoop = null, alarmGain = null, alarmEnd = 0, alarmUI = null;
function fireAlarm() {
  RT.wbtbTarget = null; saveRT();
  S.counters.wbtb++; dataChanged();
  const c = AudioEngine.init();
  const fade = clamp(S.settings.wbtbFade, 10, 300); const vol = S.settings.wbtbVol;
  closeNightScreen();
  const scr = $('#alarmScreen');
  scr.innerHTML = `<div class="pulse-ring">🌙</div><h2>Čas na WBTB</h2>
    <p class="muted" style="max-width:360px">Tiše se probuď. Neotevírej sociální sítě. Zvuk se sám ztiší za <b id="alLeft">${fade}</b> s.</p>
    <button class="btn gold big block" style="max-width:360px" id="alStop">Jsem vzhůru – ztišit</button>`;
  scr.classList.add('open'); markOverlay();
  $('#alStop').onclick = () => stopAlarm(true);
  if (c) {
    alarmGain = c.createGain(); alarmGain.connect(AudioEngine.master);
    const t = c.currentTime;
    alarmGain.gain.setValueAtTime(0.0001, t);
    alarmGain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), t + Math.min(15, fade * 0.4));
    alarmGain.gain.setValueAtTime(Math.max(0.001, vol), t + Math.max(fade - 6, fade * 0.6));
    alarmGain.gain.exponentialRampToValueAtTime(0.0001, t + fade);
    const play = () => AudioEngine.playTotem(S.settings.totem, 1, alarmGain);
    play(); alarmLoop = setInterval(play, 4200);
  }
  alarmEnd = Date.now() + fade * 1000;
  alarmUI = setInterval(() => {
    const left = Math.ceil((alarmEnd - Date.now()) / 1000);
    const el = $('#alLeft'); if (el) el.textContent = Math.max(0, left);
    if (left <= 0) stopAlarm(false);
  }, 500);
  vibrate([200, 300, 200]);
}
function stopAlarm(byUser) {
  clearInterval(alarmLoop); clearInterval(alarmUI); alarmLoop = alarmUI = null;
  if (alarmGain && AudioEngine.ctx) {
    const t = AudioEngine.ctx.currentTime;
    try { alarmGain.gain.cancelScheduledValues(t); alarmGain.gain.setValueAtTime(Math.max(0.0001, alarmGain.gain.value), t); alarmGain.gain.exponentialRampToValueAtTime(0.0001, t + 1.2); } catch (e) { /* ignorovat */ }

/* hlavní noční smyčka */
function nightTick() {
  const now = Date.now();
  if (RT.wbtbTarget && now >= RT.wbtbTarget) fireAlarm();
  if (RT.pauseTarget && now >= RT.pauseTarget) {
    RT.pauseTarget = null; saveRT();
    AudioEngine.playTotem('harp', 0.35);
    toast('Pauza skončila – zpátky do postele s technikou MILD 🌙', 5000);
    if (!RT.anchor && !RT.wbtbTarget) { AudioEngine.keepAlive(false); releaseWake(); }
    if (activeTab === 'night') renderNight();
  }
  if (RT.anchor && now >= RT.anchor.next) {
    AudioEngine.playTotem(RT.anchor.sound, RT.anchor.vol);
    RT.anchor.left--; RT.anchor.next = now + RT.anchor.every * 60000;
    if (RT.anchor.left <= 0) { RT.anchor = null; if (!RT.wbtbTarget && !RT.pauseTarget) { AudioEngine.keepAlive(false); releaseWake(); } }
    saveRT(); if (activeTab === 'night') renderNight();
  }
  const cd = $('#wbCount'); if (cd && RT.wbtbTarget) cd.textContent = fmtDur(RT.wbtbTarget - now);

    const updAt = () => { $('#wbAt').textContent = fmtTime(new Date(Date.now() + s.wbtbMinutes * 60000)); $('#wbMinL').textContent = `${Math.floor(s.wbtbMinutes / 60)} h ${s.wbtbMinutes % 60} min`; };
    updAt();
    $$('#wbPresets .chip').forEach(b => b.onclick = () => { s.wbtbMinutes = +b.dataset.m; $('#wbMin').value = s.wbtbMinutes; $$('#wbPresets .chip').forEach(x => x.classList.toggle('on', x === b)); updAt(); save(); });
    $('#wbMin').oninput = e => { s.wbtbMinutes = +e.target.value; $$('#wbPresets .chip').forEach(x => x.classList.toggle('on', +x.dataset.m === s.wbtbMinutes)); updAt(); save(); };
    $('#wbFade').oninput = e => { s.wbtbFade = +e.target.value; $('#wbFadeL').textContent = s.wbtbFade; save(); };
    $('#wbVol').oninput = e => { s.wbtbVol = +e.target.value; save(); };
    $('#wbVol').onchange = () => AudioEngine.playTotem(s.totem, s.wbtbVol);
    $('#wbStart').onclick = () => startWBTB(s.wbtbMinutes);
    $('#wbIcs').onclick = wbIcs;
  }
  if ($('#pauseStop')) $('#pauseStop').onclick = () => { RT.pauseTarget = null; saveRT(); renderNight(); };

  // totem
  $$('#toSel .chip').forEach(b => b.onclick = () => { s.totem = b.dataset.t; $$('#toSel .chip').forEach(x => x.classList.toggle('on', x === b)); save(); AudioEngine.playTotem(s.totem, s.totemVol); });
  $('#toVol').oninput = e => { s.totemVol = +e.target.value; save(); };
  $('#toPlay').onclick = () => AudioEngine.playTotem(s.totem, s.totemVol);
  $('#toRC').onchange = e => { s.totemOnRC = e.target.checked; save(); };

  // kotva
  if (RT.anchor) { $('#anStop').onclick = stopAnchor; $('#anNight').onclick = openNightScreen; }
  else {
    const bindR = (id, key, lab) => { $('#' + id).oninput = e => { s[key] = +e.target.value; if (lab) $('#' + lab).textContent = s[key]; save(); }; };
    bindR('anDel', 'anchorDelay', 'anDelL'); bindR('anEv', 'anchorEvery', 'anEvL'); bindR('anRep', 'anchorReps', 'anRepL'); bindR('anVol', 'anchorVol');
    $('#anTest').onclick = () => AudioEngine.playTotem(s.totem, s.anchorVol);
    $('#anStart').onclick = startAnchor;
  }
}

function renderAcademy() {
  const v = $('#v-academy');
  const read = S.academyRead.length;
  const L = levelInfo();
  const groups = [...new Set(ACADEMY.map(a => a.group))];
  v.innerHTML = `
    <div class="section panel">
      <div class="levelcard">${moonSVG(L.pct, L.idx, 'a' + L.idx)}<div class="grow"><h3>${esc(L.name)}</h3><p class="muted small" style="margin:2px 0 8px">${L.next ? `${L.need - L.xp} XP do úrovně ${esc(L.next)}` : 'Nejvyšší úroveň dosažena'}</p><div class="progress"><div style="width:${Math.round(L.pct * 100)}%"></div></div></div></div>
      <p class="muted small" style="margin:12px 0 0">Prostudováno ${read}/${ACADEMY.length} lekcí · každá lekce +15 XP</p>
    </div>
    <button class="tech section" id="acGuide"><span class="glyph">🧭</span><span class="grow"><h3>Jak používat aplikaci</h3><p>Ranní zápis, reality checky, WBTB, kotva a záloha – krok za krokem.</p></span></button>
    ${groups.map(g => `<div class="section"><div class="section-head"><h3>${esc(g)}</h3></div>
      ${ACADEMY.filter(a => a.group === g).map(a => `<button class="tech" data-ac="${a.id}"><span class="glyph ${S.academyRead.includes(a.id) ? 'done' : ''}">${S.academyRead.includes(a.id) ? '✓' : a.ic}</span><span class="grow"><h3>${esc(a.title)}</h3><p>${esc(a.intro.split('. ')[0])}.</p><span class="tag-level">${esc(a.time)} čtení</span></span></button>`).join('')}
    </div>`).join('')}`;
  $$('[data-ac]', v).forEach(b => b.onclick = () => openLesson(b.dataset.ac));
  $('#acGuide').onclick = () => openGuide(false);
}
function openLesson(id) {
  const a = ACADEMY.find(x => x.id === id); if (!a) return;
  const isRead = S.academyRead.includes(id);
  markOverlay();
  openSheet(`<div class="sheet-head"><span class="glyph" style="font-size:1.8rem">${a.ic}</span><h2>${esc(a.title)}</h2></div>
    <div class="prose"><p>${esc(a.intro)}</p></div>

function prepCanvas(c, h) {
  const dpr = window.devicePixelRatio || 1; const w = c.clientWidth || 320;
  c.style.height = h + 'px'; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}

function drawCharts() {
  const gold = cssVar('--gold'), violet = cssVar('--violet'), azure = cssVar('--azure'), dim = cssVar('--dim'), line = cssVar('--line'), text = cssVar('--text');
  const total = S.dreams.length, luc = S.dreams.filter(d => d.lucid).length;
  const cd = $('#cDonut');
  if (cd) {
    const { ctx, w, h } = prepCanvas(cd, 190);
    const cx = Math.min(w / 2, 110), cy = h / 2, r = 72;
    ctx.lineWidth = 22; ctx.lineCap = 'butt';
    ctx.strokeStyle = violet; ctx.globalAlpha = .55; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    if (luc) { ctx.strokeStyle = gold; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * luc / total); ctx.stroke(); }
    ctx.fillStyle = text; ctx.font = '500 30px ' + cssVar('--serif'); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(Math.round(luc / total * 100) + ' %', cx, cy - 6);
    ctx.fillStyle = dim; ctx.font = '12px ' + cssVar('--sans'); ctx.fillText('lucidita', cx, cy + 20);
    if (w > 300) {
      ctx.textAlign = 'left'; const lx = cx + r + 40;
      ctx.fillStyle = gold; ctx.fillRect(lx, cy - 26, 14, 14); ctx.fillStyle = text; ctx.font = '14px ' + cssVar('--sans'); ctx.fillText(`Lucidní: ${luc}`, lx + 22, cy - 19);
      ctx.fillStyle = violet; ctx.fillRect(lx, cy + 8, 14, 14); ctx.fillStyle = text; ctx.fillText(`Běžné: ${total - luc}`, lx + 22, cy + 15);
    }
  }
  const cl = $('#cLine');
  if (cl) {
    const { ctx, w, h } = prepCanvas(cl, 170);
    const data = S.dreams.slice().sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created).slice(-30);
    const pl = 24, pr = 10, pt = 10, pb = 22;
    const X = i => pl + (data.length === 1 ? (w - pl - pr) / 2 : i * (w - pl - pr) / (data.length - 1));
    const Y = vv => pt + (5 - vv) * (h - pt - pb) / 4;
    ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.fillStyle = dim; ctx.font = '11px ' + cssVar('--sans'); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let vv = 1; vv <= 5; vv++) { ctx.beginPath(); ctx.moveTo(pl, Y(vv)); ctx.lineTo(w - pr, Y(vv)); ctx.stroke(); ctx.fillText(vv, pl - 8, Y(vv)); }
    const grad = ctx.createLinearGradient(0, pt, 0, h - pb); grad.addColorStop(0, 'rgba(98,182,204,.35)'); grad.addColorStop(1, 'rgba(98,182,204,0)');
    ctx.beginPath(); data.forEach((d, i) => { i ? ctx.lineTo(X(i), Y(d.vivid)) : ctx.moveTo(X(i), Y(d.vivid)); });
    ctx.strokeStyle = azure; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
    if (data.length > 1) { ctx.lineTo(X(data.length - 1), h - pb); ctx.lineTo(X(0), h - pb); ctx.closePath(); ctx.fillStyle = grad; ctx.fill(); }
    data.forEach((d, i) => { ctx.beginPath(); ctx.arc(X(i), Y(d.vivid), d.lucid ? 5 : 3, 0, Math.PI * 2); ctx.fillStyle = d.lucid ? gold : azure; ctx.fill(); });
    ctx.fillStyle = dim; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    if (data.length) { ctx.fillText(fmtDate(data[0].date).replace(/ \d{4}$/, ''), pl, h - 4); ctx.textAlign = 'right'; ctx.fillText(fmtDate(data[data.length - 1].date).replace(/ \d{4}$/, ''), w - pr, h - 4); }
  }
  const cb = $('#cBars');
  if (cb) {
    const { ctx, w, h } = prepCanvas(cb, 160);
    const days = []; for (let i = 13; i >= 0; i--) days.push(dayKey(addDays(new Date(), -i)));
    const counts = days.map(k => { const ds = S.dreams.filter(d => d.date === k); return { n: ds.length, l: ds.filter(d => d.lucid).length, k }; });
    const max = Math.max(2, ...counts.map(c => c.n));
    const pb = 22, pt = 8; const bw = (w - 8) / 14;
    counts.forEach((c, i) => {
      const x = 4 + i * bw + bw * 0.18, bwi = bw * 0.64;
      const hh = (h - pb - pt) * c.n / max, hl = (h - pb - pt) * c.l / max;
      ctx.fillStyle = 'rgba(138,123,224,.18)'; ctx.fillRect(x, pt, bwi, h - pb - pt);
      ctx.fillStyle = violet; ctx.fillRect(x, h - pb - hh, bwi, hh);
      if (hl) { ctx.fillStyle = gold; ctx.fillRect(x, h - pb - hl, bwi, hl); }
      ctx.fillStyle = dim; ctx.font = '10px ' + cssVar('--sans'); ctx.textAlign = 'center';
      ctx.fillText(parseDay(c.k).getDate(), x + bwi / 2, h - 6);
    });
  }
}

function exportData() {

function handleImportText(txt) {
  let obj;
  try { obj = JSON.parse(String(txt || '').trim().replace(/^\uFEFF/, '')); } catch (e) { toast('Soubor není platný JSON'); return; }
  const data = obj && obj.data && Array.isArray(obj.data.dreams) ? obj.data : obj;
  if (!data || !Array.isArray(data.dreams)) { toast('V souboru nejsou data Lucidum'); return; }
  const incoming = mergeData(data);
  openSheet(`<div class="sheet-head"><h2>Import zálohy</h2></div>
    <p class="muted">Soubor obsahuje ${incoming.dreams.length} ${plural(incoming.dreams.length, 'sen', 'sny', 'snů')} a ${incoming.rcLog.length} reality checků.</p>
    <button class="btn primary big block" id="imMerge">Sloučit s aktuálními daty</button>
    <button class="btn danger block" style="margin-top:10px" id="imReplace">Nahradit vše</button>
    <p class="muted small" style="margin-top:12px">Před importem se automaticky vytvoří záloha současného stavu.</p>`, sh => {
    $('#imMerge', sh).onclick = () => {
      makeBackup('před importem');
      const byId = new Map(S.dreams.map(d => [d.id, d]));
      incoming.dreams.forEach(d => { const ex = byId.get(d.id); if (!ex || d.updated > ex.updated) byId.set(d.id, d); });
      S.dreams = [...byId.values()];
      S.rcLog = [...new Set(S.rcLog.concat(incoming.rcLog))].sort((a, b) => a - b);
      S.academyRead = [...new Set(S.academyRead.concat(incoming.academyRead))];
      S.customTags = [...new Set(S.customTags.concat(incoming.customTags))];
      S.rituals = Object.assign({}, incoming.rituals, S.rituals);
      S.badges = Object.assign({}, incoming.badges, S.badges);
      ['text', 'clock', 'odd', 'played'].forEach(k => { S.games[k] = Math.max(S.games[k] || 0, incoming.games[k] || 0); });
      ['wbtb', 'breath', 'anchors'].forEach(k => { S.counters[k] = Math.max(S.counters[k] || 0, incoming.counters[k] || 0); });
      dataChanged(); closeSheet(); rerender(); toast('Data sloučena ✓');
    };
    $('#imReplace', sh).onclick = () => { makeBackup('před importem'); S = incoming; dataChanged(); applyDim(); closeSheet(); rerender(); toast('Data nahrazena ✓'); };
  });
}

function openGuide(first) {
  markOverlay();
  openSheet(`<div class="sheet-head"><h2>${first ? 'Vítej v aplikaci Lucidum' : 'Jak používat Lucidum'}</h2><button class="icon-btn" id="gdClose" aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    ${first ? '<p class="muted" style="margin-top:0">Krátký návod, jak z aplikace dostat maximum. Klepni na téma pro rozbalení.</p>' : ''}
    ${GUIDE.map((s, i) => `<div class="guide-sec ${i === 0 ? 'open' : ''}"><button data-g="${i}"><span style="font-size:1.4rem">${s.ic}</span><h3>${esc(s.title)}</h3><svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="gbody">${s.lead ? `<p class="guide-lead">${esc(s.lead)}</p>` : ''}${s.ordered ? `<ol class="steps">${s.list.map(x => `<li>${x}</li>`).join('')}</ol>` : `<ul class="guide-list">${s.list.map(x => `<li>${x}</li>`).join('')}</ul>`}</div></div>`).join('')}
    <button class="btn primary big block" id="gdOk" style="margin-top:8px">${first ? 'Začít' : 'Rozumím'}</button>`, sh => {
    $$('[data-g]', sh).forEach(b => b.onclick = () => b.parentElement.classList.toggle('open'));
    $('#gdClose', sh).onclick = closeSheet;
    $('#gdOk', sh).onclick = closeSheet;
  });
}

/* ---------- Navigace ---------- */
const TABS = ['journal', 'reality', 'night', 'academy', 'stats'];
let activeTab = 'journal';
const RENDER = { journal: () => renderJournal(), reality: () => renderReality(), night: () => renderNight(), academy: () => renderAcademy(), stats: () => renderStats() };
function switchTab(name) {
  if (!TABS.includes(name)) return;
  const fromIdx = TABS.indexOf(activeTab), toIdx = TABS.indexOf(name);
  activeTab = name;
  $$('#nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  $$('.view').forEach(v => { v.classList.remove('active', 'from-left'); });
  const view = $('#v-' + name);
  if (toIdx < fromIdx) view.classList.add('from-left');
  RENDER[name]();
  view.classList.add('active');
  $('#main').scrollTop = 0;
}
function rerender() { RENDER[activeTab](); updateHeader(); }

/* ---------- Hvězdné pozadí ---------- */
function drawStars() {
  const c = $('#stars'); const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth, h = window.innerHeight;
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const n = Math.round(w * h / 5200);
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h * 0.85, r = rnd() * 1.1 + 0.2, a = rnd() * 0.6 + 0.15;
    ctx.fillStyle = rnd() > 0.85 ? `rgba(201,168,92,${a})` : `rgba(200,195,240,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- Start ---------- */
function init() {
  load(); loadRT(); dailyBackup(); applyDim(); updateHeader(); drawStars();
  $$('#nav button').forEach(b => b.onclick = () => { vibrate(6); switchTab(b.dataset.tab); });
  $('#btnSettings').onclick = openSettings;
  $('#btnDim').onclick = openNightScreen;
  $('#btnHelp').onclick = () => openGuide(false);
  $('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });
  $('#fileImport').onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => handleImportText(r.result); r.onerror = () => toast('Soubor nelze přečíst'); r.readAsText(f, 'utf-8');
    e.target.value = '';
  };
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawStars(); if (activeTab === 'stats') drawCharts(); }, 200); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { save(); if (ed) setDraft(ed); } else { nightTick(); if (activeTab === 'reality' || activeTab === 'stats') rerender(); } });
  window.addEventListener('pagehide', () => { save(); if (ed) setDraft(ed); });
  // obnovení běžících nočních nástrojů po znovuotevření aplikace
  if (RT.wbtbTarget || RT.anchor || RT.pauseTarget) {
    requestWake();
    const resume = () => { AudioEngine.init(); AudioEngine.keepAlive(true); document.removeEventListener('pointerdown', resume); };
    document.addEventListener('pointerdown', resume);
  }
  switchTab('journal');
  checkBadges();
  setInterval(nightTick, 1000);
  if (!S.seenGuide) { S.seenGuide = true; save(); setTimeout(() => openGuide(true), 600); }
}
init();
</script>
