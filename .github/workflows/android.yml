      - name: Instalace závislostí
        run: npm install --no-audit --no-fund

      - name: Vytvořit Android projekt
        run: |
          rm -rf android
          npx cap add android

      - name: Nativní plugin pro udržení obrazovky (WBTB)
        run: |
          D=android/app/src/main/java/cz/lucidum/app
          cat > $D/KeepAwakePlugin.java << 'EOF'
          package cz.lucidum.app;

          import android.view.WindowManager;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "KeepAwake")
          public class KeepAwakePlugin extends Plugin {
              @PluginMethod
              public void keepAwake(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      getActivity().getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      call.resolve();
                  });
              }

              @PluginMethod
              public void allowSleep(PluginCall call) {
                  getActivity().runOnUiThread(() -> {
                      getActivity().getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                      call.resolve();
                  });
              }
          }
          EOF
          cat > $D/MainActivity.java << 'EOF'
          package cz.lucidum.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(KeepAwakePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Zvuky a ikona oznámení, přesné budíky
        run: |
          R=android/app/src/main/res
          mkdir -p $R/raw $R/drawable
          cat > $R/drawable/ic_stat_lucidum.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF" android:pathData="M12,3a6,6 0 0,0 9,9 9,9 0 1,1 -9,-9z"/>
          </vector>
          EOF
          python3 << 'EOF'
          import math, struct, wave
          RATE = 22050
          def write(path, notes, length):
              n = int(RATE * length); buf = [0.0] * n
              for start, freq, vol, decay in notes:
                  s0 = int(start * RATE)
                  for i in range(s0, n):
                      t = (i - s0) / RATE
                      env = min(1.0, t / 0.01) * math.exp(-t / decay)
                      v = 0.0
                      for ratio, g in ((1, 1.0), (2, 0.45), (3, 0.2), (4.2, 0.08)):
                          v += g * math.sin(2 * math.pi * freq * ratio * t)
                      buf[i] += vol * env * v
              peak = max(abs(x) for x in buf) or 1
              with wave.open(path, 'w') as f:
                  f.setnchannels(1); f.setsampwidth(2); f.setframerate(RATE)
                  f.writeframes(b''.join(struct.pack('<h', int(x / peak * 0.8 * 32767)) for x in buf))
          R = 'android/app/src/main/res/raw/'
          write(R + 'lucidum_bell.wav', [(0, 523.25, 0.5, 1.6), (0.9, 659.25, 0.55, 1.6), (1.8, 783.99, 0.6, 1.8), (3.0, 1046.5, 0.5, 2.0), (4.6, 783.99, 0.35, 1.8)], 8.0)
          write(R + 'lucidum_chime.wav', [(0, 880.0, 0.6, 0.5), (0.18, 1318.5, 0.5, 0.7)], 1.6)
          EOF
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          tail -4 android/app/src/main/AndroidManifest.xml

      - name: Ikona a úvodní obrazovka
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          mkdir -p assets
          python3 << 'EOF'
          from PIL import Image, ImageDraw, ImageFilter
          import random
          def bg(size):
              im = Image.new('RGB', (size, size), '#0b1028'); d = ImageDraw.Draw(im)
              for r in range(size // 2, 0, -4):
                  t = r / (size / 2)
                  d.ellipse((size/2-r, size*0.45-r, size/2+r, size*0.45+r), fill=(int(11+25*(1-t)), int(16+14*(1-t)), int(40+50*(1-t))))
              random.seed(3)
              for _ in range(size // 12):
                  x, y = random.random()*size, random.random()*size; rr = random.random()*size/700 + size/1400
                  d.ellipse((x-rr, y-rr, x+rr, y+rr), fill=(210, 205, 240))
              return im
          def moon(size, scale):
              R = size*scale/2; cx = cy = size/2
              disc = Image.new('L', (size, size), 0); ImageDraw.Draw(disc).ellipse((cx-R, cy-R, cx+R, cy+R), fill=255)
              cut = Image.new('L', (size, size), 0); ImageDraw.Draw(cut).ellipse((cx-R*0.45, cy-R*1.12, cx+R*1.5, cy+R*0.82), fill=255)
              mask = Image.composite(Image.new('L', (size, size), 0), disc, cut)
              out = Image.new('RGBA', (size, size), (201, 168, 92, 0))
              out.putalpha(mask.filter(ImageFilter.GaussianBlur(size/25)).point(lambda v: int(v*0.45)))
              gold = Image.new('RGBA', (size, size), (201, 168, 92, 255)); gd = ImageDraw.Draw(gold)
              ox, oy = cx-R*0.45, cy-R*0.35
              for r in range(int(R*1.6), 0, -2):
                  t = min(1, r/(R*1.4))
                  gd.ellipse((ox-r, oy-r, ox+r, oy+r), fill=(int(245-49*t), int(232-72*t), int(192-108*t), 255))
              out.paste(gold, (0, 0), mask)
              s = size*0.03; x, y = cx+R*0.5, cy-R*0.1
              ImageDraw.Draw(out).polygon([(x,y-s*2),(x+s*0.45,y-s*0.45),(x+s*2,y),(x+s*0.45,y+s*0.45),(x,y+s*2),(x-s*0.45,y+s*0.45),(x-s*2,y),(x-s*0.45,y-s*0.45)], fill=(240,225,180,255))
              return out
          Image.alpha_composite(bg(1024).convert('RGBA'), moon(1024, 0.56)).convert('RGB').save('assets/icon-only.png')
          moon(1024, 0.42).save('assets/icon-foreground.png')
          bg(1024).save('assets/icon-background.png')
          sp = Image.alpha_composite(bg(2732).convert('RGBA'), moon(2732, 0.22)).convert('RGB')
          sp.save('assets/splash.png'); sp.save('assets/splash-dark.png')
          EOF
          npx @capacitor/assets generate --android --iconBackgroundColor '#0b1028' --iconBackgroundColorDark '#0b1028' --splashBackgroundColor '#0b1028' --splashBackgroundColorDark '#0b1028'

      - name: Synchronizace webu do aplikace
        run: npx cap sync android

      - name: Podpisový klíč a číslo verze
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          sed -i "0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file('..\/..\/lucidum.keystore')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }/" $G

      - name: Sestavení APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Přejmenovat APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Lucidum.apk

      - name: Uložit jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Lucidum-APK
          path: Lucidum.apk

      - name: Vydat ke stažení (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" Lucidum.apk \
            --title "Lucidum 1.0.${{ github.run_number }}" \
            --notes "Stáhni Lucidum.apk a nainstaluj. Nová verze se nainstaluje přes starou, data zůstanou."
            
