name: Sestavit Lucidum APK

# Stačí mít v repozitáři jen dva soubory:
#   index.html                          (celá aplikace)
#   .github/workflows/android.yml       (tento soubor)
# Všechno ostatní se vytvoří automaticky.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Připravit projekt
        run: |
          if [ ! -f index.html ]; then echo "V repozitáři chybí index.html"; exit 1; fi
          mkdir -p www && cp index.html www/index.html
          cat > package.json << 'EOF'
          {
            "name": "lucidum",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "8.6.0",
              "@capacitor/core": "8.6.0",
              "@capacitor/filesystem": "8.1.5",
              "@capacitor/local-notifications": "8.3.1",
              "@capacitor/share": "8.0.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.6.0"
            }
          }
          EOF
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "cz.lucidum.app",
            "appName": "Lucidum",
            "webDir": "www",
            "backgroundColor": "#0b1028",
            "android": { "backgroundColor": "#0b1028", "allowMixedContent": false },
            "plugins": {
              "SystemBars": { "insetsHandling": "css", "style": "DARK", "initialViewportFitValueHint": "cover" },
              "LocalNotifications": { "smallIcon": "ic_stat_lucidum", "iconColor": "#c9a85c" }
            }
